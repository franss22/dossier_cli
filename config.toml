# config.toml
[audio]
chunk_minutes = 25
overlap_seconds = 300
sample_rate = 16000

[transcription]
model_size = "large-v3-turbo"
language = "es"
device = "cpu"
compute_type = "int8"

[output]
directory = "output"
format = ["json", "md"]

[analysis]
enabled = false
provider = "gemini"
model = "gemini-2.5-flash"
