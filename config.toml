# config.toml
[audio]
chunk_minutes = 20
overlap_seconds = 60
sample_rate = 16000

[transcription]
model = "medium"
language = "es"
device = "cpu"
compute_type = "int8"

[output]
directory = "output"
format = ["json", "md"]

[diarization]
enabled = false

[analysis]
enabled = false
provider = "gemini"
model = "gemini-2.5-flash"

[obsidian]
enabled = false
vault = ""
