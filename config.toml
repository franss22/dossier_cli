# config.toml
[audio]
chunk_minutes = 25
overlap_seconds = 300
sample_rate = 16000
chunk_mode = "full"

[transcription]
model_size = "large-v3-turbo"
language = "es"
device = "cpu"
compute_type = "int8"

[output]
directory = "output"
format = ["json", "md"]

[analysis]
enabled = false
provider = "gemini"
model = "gemini-2.5-flash"

[speakers]
labels = { b1rdest = "Diego (Mishima)", cfspr = "Coni (May)", exrider = "Luciano (Moriarty)", emi22z = "Emi (GM)", quemares = "Menares (Morgan)", kleinmetallicis = "Taco (Mastiff)" }
